backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  # 1. YOUR PROJECTS (Keep this as it is)
  - name: "projects"
    label: "Research Operations"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Domain", name: "domain", widget: "select", options: ["Hardware/Sec", "AI/Automation", "Consulting"]}
      - {label: "Status", name: "status", widget: "select", options: ["Active", "Completed"]}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Impact", name: "impact", widget: "string"}
      - {label: "Core Tools (Comma separated)", name: "tools", widget: "string"}
# 2. SECTIONED SITE CONTENT
  - name: "settings"
    label: "Site Content (Edit Everything)"
    files:
      - label: "Landing Page Data"
        name: "profile"
        file: "src/content/profile.json"
        fields:
          - label: "00. Site Engine (Templates & Themes)"
            name: "engine"
            widget: "object"
            fields:
              - label: "Main Template"
                name: "template"
                widget: "select"
                options: ["Researcher", "Minimalist", "Corporate"]
              - label: "Hero Sub-Template"
                name: "hero_style"
                widget: "select"
                options: ["Animated Typing", "Static Professional"]
              - label: "Color Theme"
                name: "theme_color"
                widget: "select"
                options: ["Cyan", "Violet", "Emerald", "Ruby"]
          # HERO SECTION
          - label: "01. Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Profile Image", name: "avatar", widget: "image", required: false}
              - {label: "Main Title (Name)", name: "name", widget: "string"}
              - {label: "Animated Roles (Comma separated)", name: "roles", widget: "string"}
              - {label: "Hero Subtitle", name: "subtitle", widget: "text"}
              - {label: "Bottom Tags (Comma separated)", name: "tags", widget: "string"}
          
          # IDENTITY SECTION
          - label: "02. Identity (Who Am I)"
            name: "identity"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Main Biography", name: "bio", widget: "text"}
              - {label: "Projects Built", name: "stat_projects", widget: "string"}
              - {label: "Leadership Role", name: "stat_leadership", widget: "string"}
              
          # CORE DOMAINS (NEW)
          - label: "03. Core Domains"
            name: "domains"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - label: "Domain List"
                name: "list"
                widget: "list"
                fields:
                  - {label: "Domain Name", name: "name", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}

          # LAB & EXPERIMENTS (NEW)
          - label: "04. Lab & Experiments"
            name: "lab"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Experiment Tags (Comma separated)", name: "tags", widget: "string"}

          # CRACK DEVELOPERS / CONSULTING (NEW)
          - label: "05. Crack Developers & Consulting"
            name: "consulting"
            widget: "object"
            fields:
              - {label: "Section Title", name: "title", widget: "string"}
              - {label: "Headline", name: "headline", widget: "string"}
              - {label: "Main Body", name: "body", widget: "text"}
              - {label: "Sub Body", name: "sub_body", widget: "text"}
              - {label: "CTA Text", name: "cta_text", widget: "string"}
              
          # GLOBAL LINKS
          - label: "Global Links & Contact"
            name: "links"
            widget: "object"
            fields:
              - {label: "Email", name: "email", widget: "string"}
              - {label: "LinkedIn URL", name: "linkedin", widget: "string"}
              - {label: "GitHub URL", name: "github", widget: "string"}