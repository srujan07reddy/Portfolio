local_backend: true

backend:
  name: test-repo
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  # TAB 1: MODULAR PAGE BUILDER
  - name: "settings"
    label: "📄 Site Content Builder"
    files:
      - label: "Homepage Editor"
        name: "profile"
        file: "src/content/profile.json"
        fields:
          
          # 1. FIXED HERO SECTION
          - label: "01. Fixed Hero Section"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - {label: "Profile Image", name: "avatar", widget: "image", required: false}
              - {label: "Main Title (Name)", name: "name", widget: "string"}
              - {label: "Animated Roles", name: "roles", widget: "string"}
              - {label: "Hero Subtitle", name: "subtitle", widget: "text"}
              - {label: "Tech Tags (Comma separated)", name: "tags", widget: "string"}

          # 2. THE DYNAMIC BUILDER 
          - label: "Page Sections"
            name: "page_blocks"
            widget: "list"
            label_singular: "Section"
            collapsed: false
            types:
              
              - label: "👤 Identity Section"
                name: "identity_block"
                widget: "object"
                fields:
                  - {label: "Section Title", name: "title", widget: "string", default: "01 // IDENTITY"}
                  - {label: "Main Biography", name: "bio", widget: "text"}
                  - {label: "Projects Built", name: "stat_projects", widget: "string"}
                  - {label: "Leadership Role", name: "stat_leadership", widget: "string"}

              - label: "🛡️ Domains Section"
                name: "domains_block"
                widget: "object"
                fields:
                  - {label: "Section Title", name: "title", widget: "string", default: "02 // CORE DOMAINS"}
                  - label: "Domain List"
                    name: "list"
                    widget: "list"
                    fields:
                      - {label: "Domain Name", name: "name", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}

              - label: "📂 Projects Section"
                name: "projects_block"
                widget: "object"
                fields:
                  - {label: "Section Title", name: "title", widget: "string", default: "03 // FEATURED PROJECTS"}
                  - {label: "Section Subtitle", name: "subtitle", widget: "text", required: false}
                  - label: "Featured Projects List"
                    name: "projects_list"
                    widget: "list"
                    fields:
                      - {label: "Project Title", name: "name", widget: "string"}
                      - {label: "Short Description", name: "description", widget: "text"}
                      - {label: "Tech Stack / Tools", name: "tools", widget: "string"}
                      - {label: "Project Link (URL)", name: "url", widget: "string", required: false}

              - label: "💼 Consulting Section"
                name: "consulting_block"
                widget: "object"
                fields:
                  - {label: "Section Title", name: "title", widget: "string", default: "04 // BUSINESS ALIGNMENT"}
                  - {label: "Headline", name: "headline", widget: "string"}
                  - {label: "Main Body", name: "body", widget: "text"}
                  - {label: "Sub Body", name: "sub_body", widget: "text", required: false}
                  - label: "Action Button"
                    name: "action_button"
                    widget: "object"
                    required: false
                    fields:
                      - {label: "Button Text", name: "cta_text", widget: "string", required: true}
                      - {label: "Button URL", name: "cta_url", widget: "string", required: true}

              - label: "✨ Custom Section (Freeform)"
                name: "custom_block"
                widget: "object"
                fields:
                  - {label: "Section Title", name: "title", widget: "string", default: "New Section"}
                  - {label: "Main Content", name: "body", widget: "markdown"}
                  - label: "Custom Action Button (Optional)"
                    name: "action_button"
                    widget: "object"
                    required: false
                    fields:
                      - {label: "Button Text", name: "cta_text", widget: "string", required: true}
                      - {label: "Button URL", name: "cta_url", widget: "string", required: true}

  # TAB 2: YOUR PROJECTS (Standalone Pages)
  - name: "projects"
    label: "🚀 Research Operations"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Domain", name: "domain", widget: "select", options: ["Hardware/Sec", "AI/Automation", "Consulting"]}
      - {label: "Status", name: "status", widget: "select", options: ["Active", "Completed"]}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Impact", name: "impact", widget: "string"}
      - {label: "Core Tools", name: "tools", widget: "string"}

  # TAB 3: THEME CONTROLS
  - name: "theme_settings"
    label: "🎨 Templates & Themes"
    files:
      - label: "Theme Configuration"
        name: "theme"
        file: "src/content/theme.json"
        fields:
          - {label: "Main Template", name: "template", widget: "select", options: ["Researcher", "Minimalist", "Corporate"]}
          - {label: "Hero Sub-Template", name: "hero_style", widget: "select", options: ["Animated Typing", "Static Professional"]}
          - {label: "Color Theme", name: "theme_color", widget: "select", options: ["Cyan", "Violet", "Emerald", "Ruby"]}